<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>自然入眠</title><link rel="stylesheet" href="style.css"></head><body>
<div class="scene"><video id="filmA" muted playsinline preload="auto" src="media/rain-loop4k.mp4"></video><video id="filmB" muted playsinline preload="metadata" src="media/rain-loop4k.mp4"></video><div class="shade"></div></div>
<main id="homePage"><header><span class="brand"><i data-lucide="leaf"></i>自然入眠</span><button id="settings" class="icon" title="设置" aria-label="设置"><i data-lucide="settings"></i></button></header>
<section class="player"><h1>今夜，睡在雨林里</h1><p id="status" role="status">闭上眼睛，慢慢放松</p><button id="play" class="play" aria-label="播放声音" title="播放"><i data-lucide="play"></i></button><div class="playing-label" id="playingLabel">热带雨林 · 自然原声</div></section>
<footer><div class="sounds" role="group" aria-label="音景选择" id="sounds"></div><div class="timer-row"><button id="timerToggle" class="timer-toggle" aria-expanded="false"><i data-lucide="timer"></i><span>睡眠定时</span></button><output id="countdown">持续播放</output></div><div id="timerPanel" class="timer-panel" hidden><div class="timers" role="group" aria-label="睡眠定时"><button data-min="15">15 分钟</button><button data-min="30">30 分钟</button><button data-min="60">60 分钟</button><button id="custom">自定义</button></div><div class="custom" id="customRow" hidden><input id="minutes" type="number" min="1" max="720" value="90" aria-label="定时分钟"><span>分钟</span><button id="apply">应用</button></div></div></footer></main>
<section id="settingsPage" class="settings-page" aria-hidden="true" hidden><div class="settings-sheet"><header class="settings-header"><button id="settingsBack" class="back-button" title="返回" aria-label="返回"><i data-lucide="arrow-left"></i></button><h2>设置</h2><span class="settings-spacer"></span></header><div class="settings-list"><label class="setting-row" for="minimalMode"><span><strong>极简模式</strong><small>只播放声音，隐藏视频背景</small></span><input type="checkbox" id="minimalMode" role="switch"></label><label class="setting-row" for="mixAudio"><span><strong>与其他应用同时播放</strong><small>不暂停其他应用的声音</small></span><input type="checkbox" id="mixAudio" role="switch"></label><label class="setting-row" for="motionOff"><span><strong>关闭动效</strong><small>关闭按钮和页面过渡动画</small></span><input type="checkbox" id="motionOff" role="switch"></label></div></div></section>
<script src="lucide.js"></script><script src="tracks.js"></script><script src="app.js"></script></body></html>
