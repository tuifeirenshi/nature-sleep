<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>自然入眠</title><link rel="stylesheet" href="style.css"></head><body>
<div class="scene"><video id="filmA" muted playsinline preload="auto" src="media/rain-loop4k.mp4"></video><video id="filmB" muted playsinline preload="metadata" src="media/rain-loop4k.mp4"></video><div class="shade"></div></div>
<main><header><span class="brand"><i data-lucide="leaf"></i>自然入眠</span><button id="dark" class="icon" title="熄屏模式" aria-label="熄屏模式"><i data-lucide="moon"></i></button></header>
<section class="player"><div class="eyebrow">NATURE SOUNDS</div><h1>今夜，睡在雨林里</h1><p id="status" role="status">闭上眼睛，慢慢放松</p><button id="play" class="play" aria-label="播放声音" title="播放"><i data-lucide="play"></i></button><div class="playing-label" id="playingLabel">热带雨林 · 自然原声</div></section>
<footer><div class="sounds" role="group" aria-label="音景选择" id="sounds"></div><div class="timer-row"><span><i data-lucide="timer"></i>睡眠定时</span><output id="countdown">持续播放</output></div><div class="timers" role="group" aria-label="睡眠定时"><button data-min="0" class="selected">不限</button><button data-min="15">15 分钟</button><button data-min="30">30 分钟</button><button data-min="60">60 分钟</button><button id="custom">自定义</button></div><div class="custom" id="customRow" hidden><input id="minutes" type="number" min="1" max="720" value="90" aria-label="定时分钟"><span>分钟</span><button id="apply">确定</button></div></footer></main>
<button id="wake" hidden aria-label="退出熄屏模式">轻触唤醒</button><script src="lucide.js"></script><script src="tracks.js"></script><script src="app.js"></script></body></html>
