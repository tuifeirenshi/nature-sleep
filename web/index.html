<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>自然入眠</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <video id="filmA" muted playsinline preload="none" poster="media/covers/rain-jungle.jpg" src="media/rain-loop4k.mp4"></video>
    <video id="filmB" muted playsinline preload="none" poster="media/covers/rain-jungle.jpg" src="media/rain-loop4k.mp4"></video>
    <div class="shade"></div>
  </div>
  <main id="homePage">
    <header class="app-header">
      <button id="settings" class="icon" title="设置" aria-label="设置"><i data-lucide="settings-2"></i></button>
    </header>
    <section class="player" aria-live="polite">
      <h1 id="trackTitle">今夜，睡在雨林里</h1>
      <p id="status" role="status">闭上眼睛，慢慢放松</p>
      <button id="play" class="play" aria-label="播放声音" title="播放" aria-pressed="false">
        <canvas class="play-lens" aria-hidden="true"></canvas>
        <span class="play-orbit" aria-hidden="true"></span>
        <span class="play-glyph" aria-hidden="true">
          <i class="play-symbol play-symbol-start" data-lucide="play"></i>
          <i class="play-symbol play-symbol-stop" data-lucide="pause"></i>
        </span>
      </button>
      <div class="playing-label" id="playingLabel">热带雨林 · 自然原声</div>
    </section>
    <footer>
      <div class="sound-section">
        <div class="sounds-viewport" id="soundsViewport">
          <div class="sounds" role="group" aria-label="音景选择" id="sounds"></div>
        </div>
      </div>
      <section class="timer-area" aria-label="定时设置">
        <div class="timer-row">
          <button id="timerToggle" class="timer-toggle" aria-expanded="false" aria-controls="timerPanel"><i data-lucide="timer"></i><span id="timerLabel">定时</span><i class="timer-chevron" data-lucide="chevron-down" aria-hidden="true"></i></button>
          <button id="countdown" class="countdown-button" type="button" hidden></button>
        </div>
        <div id="timerPanel" class="timer-panel" hidden>
          <div class="timers" id="timerPresets" role="group" aria-label="睡眠定时">
            <button data-min="15">15 分钟</button>
            <button data-min="30">30 分钟</button>
            <button data-min="60">60 分钟</button>
            <button id="custom" aria-expanded="false" aria-controls="customRow">自定义</button>
          </div>
          <div class="custom" id="customRow" hidden>
            <div class="time-column"><div class="minute-wheel-wrap"><div id="hours" class="minute-wheel" role="spinbutton" tabindex="0" aria-label="小时" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0"></div><span class="minute-highlight" aria-hidden="true"></span></div><span id="hourUnit">时</span></div>
            <div class="time-column"><div class="minute-wheel-wrap"><div id="minutes" class="minute-wheel" role="spinbutton" tabindex="0" aria-label="分钟" aria-valuemin="0" aria-valuemax="60" aria-valuenow="30"></div><span class="minute-highlight" aria-hidden="true"></span></div><span id="minuteUnit">分</span></div>
          </div>
        </div>
      </section>
    </footer>
  </main>
  <section id="settingsPage" class="settings-page" aria-hidden="true" hidden>
    <div class="settings-content">
      <header class="settings-header">
        <button id="settingsBack" class="back-button" title="返回" aria-label="返回"><i data-lucide="arrow-left"></i></button>
        <h2 id="settingsTitle">设置</h2>
        <span class="settings-spacer"></span>
      </header>
      <div class="settings-list">
        <label class="setting-row" for="languageSelect">
          <span><strong id="languageLabel">语言</strong><small id="languageHint">选择界面语言</small></span>
          <select id="languageSelect" aria-label="语言">
            <option value="en">English</option>
            <option value="zh-CN">简体中文</option>
            <option value="es">Español</option>
            <option value="ja">日本語</option>
            <option value="pt-BR">Português (Brasil)</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="ko">한국어</option>
            <option value="it">Italiano</option>
            <option value="ru">Русский</option>
          </select>
        </label>
        <label class="setting-row" for="minimalMode"><span><strong id="minimalLabel">极简模式</strong><small id="minimalHint">只播放声音，隐藏视频背景</small></span><input type="checkbox" id="minimalMode" role="switch"></label>
        <label class="setting-row" for="mixAudio"><span><strong id="mixLabel">与其他应用同时播放</strong><small id="mixHint">不暂停其他应用的声音</small></span><input type="checkbox" id="mixAudio" role="switch"></label>
      </div>
    </div>
  </section>
  <script src="lucide.js"></script>
  <script src="tracks.js"></script>
  <script src="i18n.js"></script>
  <script src="liquid-glass.js?v=integrated-16"></script>
  <script src="app.js"></script>
</body>
</html>
